<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">master-ai</title>
  <desc id="desc">Локальная мастерская для подготовки кампаний и игры за столом. Документы, мастерская и игровые сессии связаны в одном мире.</desc>
